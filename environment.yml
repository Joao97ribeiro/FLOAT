channels:
  - conda-forge
  - defaults

dependencies:
  - python<3.13  # numpy<2.0 has no wheels for Python 3.13
  - absl-py  # used by the CLI examples (--flagfile / flags.DEFINE_*)
  - coveralls
  - cython
  - jsonschema
  - make
  - matplotlib
  - meson
  - moorpy=1.1.0
  - ninja
  - nlopt<=2.8
  - numpy<2.0  # WISDEM/openmdao stack not yet compatible with NumPy 2.x
  - numpydoc
  - openmdao
  - openpyxl
  - pandas
  - pip
  - pydoe3
  - pyoptsparse
  - pytest
  - pytest-cov
  - python-benedict
  - pyyaml
  - ruamel.yaml
  - scipy
  - setuptools
  - simpy
  - sortedcontainers
  - statsmodels
  - swig
  - compilers  # provides gcc/g++/gfortran on Linux/macOS; required by setup.py
  - pip:
    - orbit-nrel>=1.2.1
    - dearpygui
# Windows-only extras (install separately if needed):
#  - m2w64-toolchain
#  - libpython
# Optional extras:
#  - petsc4py        # not on Windows
#  - mpi4py          # only if the system has MPI built and you want to use it
