# Run: python examples/06_tower_fatigue_optimization_comparison/task.py --flagfile=examples/06_tower_fatigue_optimization_comparison/config.cfg
#
# Produces a single combined comparison of FLOAT tower optimization runs.
#
# LIST FLAGS (comma-separated, no spaces, matching order):
#   --sql_paths   one SQL per run
#   --csv_paths   one CSV per run
#   --labels      one label per run

--output_dir=outputs/06_tower_fatigue_optimization_comparison

# Explicit list of result pairs and matching labels.
--sql_paths=<path/to/case1/log_opt.sql>,<path/to/case2/log_opt.sql>
--csv_paths=<path/to/case1_tower.csv>,<path/to/case2_tower.csv>
--labels=<case1>,<case2>

# Constraint bounds are recovered from the shared 22mw_fatigue_example inputs.
--files_dir=examples/input_files/22mw_fatigue_example
--analysis_filename=analysis_options_optimization
