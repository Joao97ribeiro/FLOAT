# Flagfile for examples/03_tower_fatigue_analysis_cli/task.py.
# Run: python examples/03_tower_fatigue_analysis_cli/task.py \
#          --flagfile=examples/03_tower_fatigue_analysis_cli/config.cfg

# Directory containing the geometry/modeling/analysis YAML files.
--files_dir=examples/input_files/22mw_fatigue_example

# Filenames inside files_dir (without the .yaml extension).
--geometry_filename=IEA-22-280-RWT_Floater
--modeling_filename=modeling_options_tower_fatigue
--analysis_filename=analysis_options

# If True, force FLOAT to use the tower reference axis (hub_height_user=0.0).
--overridden=True

# If True, performs a dry run (no outputs written).
--run_only=False

# If True, save tower_summary.json next to the FLOAT outputs.
--save_summary=True

# If True, log the tower summary table after the run.
--log_summary=True

# If True, save every tower profile plot to <output_dir>/plots/.
--save_plot=True

# Output directory for plots. Comment out to use general.folder_output from analysis YAML.
--output_dir=outputs/03_tower_fatigue_analysis_cli
