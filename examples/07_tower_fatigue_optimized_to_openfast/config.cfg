# Run: python examples/07_tower_fatigue_optimized_to_openfast/task.py \
#        --flagfile=examples/07_tower_fatigue_optimized_to_openfast/config.cfg
#
# Regenerates AeroDyn15.dat and ElastoDyn_tower.dat from the optimized tower
# geometry stored in a WISDEM-generated YAML output.

# Inputs (used to recover tower reference heights + materials).
--wisdem_files_dir=examples/input_files/22mw_fatigue_example
--geometry_filename=IEA-22-280-RWT

# FLOAT optimization output: directory + filename of the WISDEM-generated
# geometry YAML (whatever name WISDEM wrote, e.g. <fname_output>.yaml).
--wisdem_results_dir=<path/to/optimization_output>
--wisdem_yaml_output=<fname_output>.yaml

# OpenFAST input templates to update.
--openfast_inputs_dir=examples/input_files/22mw_openfast
--openfast_aero_filename=IEA-22-280-RWT-Semi_AeroDyn15.dat
--openfast_elasto_filename=IEA-22-280-RWT-Semi_ElastoDyn_tower.dat
