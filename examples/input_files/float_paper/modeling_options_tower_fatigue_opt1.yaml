# FLOAT OPT1 22 MW Turbine - Tower Fatigue Analysis Modeling Options
General:
    verbosity: False  # When set to True, the code prints to screen many infos

WISDEM:
    RotorSE:
        flag: False
        spar_cap_ss: spar_cap_ss # Name in the yaml of the spar cap laminate on the suction side
        spar_cap_ps: spar_cap_ps # Name in the yaml of the spar cap laminate on the pressure side
        te_ss: te_reinforcement_ss # Name in the yaml of the trailing edge reinforcement laminate on the suction side
        te_ps: te_reinforcement_ps # Name in the yaml of the trailing edge reinforcement laminate on the pressure side
        n_pitch_perf_surfaces: 5
        n_tsr_perf_surfaces: 5
        gust_std: 0.0
        n_span: 60
        n_pc: 50
        peak_thrust_shaving: True
        thrust_shaving_coeff: 0.7
        layer_name: []
        n_layers: 0

    DriveSE:
        flag: False
        
    TowerSE:             # Options of TowerSE module
        flag: True
        wind: PowerWind  # Wind scaling relationship with height: [PowerWind, LogisticWind] (default: PowerWind)
        gamma_f: 1.2    # Partial safety factor on loads (default: 1.35)
        gamma_m: 1.3     # Partial safety factor for materials (default: 1.3)
        gamma_n: 1.0     # Partial safety factor for consequence of failure (default: 1.0)
        gamma_b: 1.1     # Partial safety factor for buckling (default: 1.1)
        gamma_freq: 1.1  # Partial safety factor on modal frequencies (default: 1.1)
        gamma_fatigue: 1.755  # Partial safety factor for fatigue failure (default: 1.0)
        buckling_method: DNVGL # Buckling code type [Eurocode, Euro-code, eurocode, euro-code, DNVGL, dnvgl, DNV-GL, dnv-gl] (default: dnvgl)
        buckling_length: 15    # Buckling length (m) factor in Eurocode safety check (default: 10.0)
        frame3dd:        # Set of Frame3DD options used for tower analysis
            shear: True  # Inclusion of shear area for symmetric sections (default: True)
            geom: True   # Inclusion of shear stiffening through axial loading (default: True)
            modal_method: 1 # Eigenvalue solver 1=Subspace-Jacobi iteration, 2=Stodola (matrix iteration) (default: 1)
            tol: 1e-9    # Convergence tolerance for modal eigenvalue solution (default: 1e-9)
        n_refine: 3    
        soil_springs: False #test
        gravity_foundation: False #test
        fatigue:
            m: 4
            k: 0.2
            t_ref: 25.
