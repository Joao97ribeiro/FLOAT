# Flagfile for examples/04_tower_fatigue_optimization_cli/task.py.
# Run: python examples/04_tower_fatigue_optimization_cli/task.py \
#          --flagfile=examples/04_tower_fatigue_optimization_cli/config.cfg

# Directory containing the geometry/modeling/analysis YAML files.
--files_dir=examples/input_files/22mw_fatigue_example

# Filenames inside files_dir (without the .yaml extension).
--geometry_filename=IEA-22-280-RWT
--modeling_filename=modeling_options_tower_fatigue
--analysis_filename=analysis_options_optimization

# If True, force FLOAT to use the tower reference axis (hub_height_user=0.0).
--overridden=True

# If True, performs a dry run (no outputs written).
--run_only=False

# If True, save tower_summary.json next to the FLOAT outputs.
--save_summary=True

# If True, log the tower summary table after the run.
--log_summary=True

# If True, save every tower profile plot to <output_dir>/plots/ with bounds.
--save_plot=True

# If True, regenerate OpenFAST .dat files (AeroDyn15.dat + ElastoDyn_tower.dat)
# from the optimized geometry. Requires --openfast_inputs_dir to be set below.
#
# Files modified per design (under <output_dir>/Constrained_Tower_<idx>/):
#   AeroDyn15.dat       TwrElev, TwrDiam, NumTwrNds
#   ElastoDyn_tower.dat HtFract, TMassDen, TwFAStif, TwSSStif, NTwInpSt
--export_to_openfast=True

# Path to the directory with OpenFAST input templates to update.
--openfast_inputs_dir=/home/joao/FLOAT/examples/input_files/22mw_openfast

# Filenames of the AeroDyn/ElastoDyn templates inside --openfast_inputs_dir.
--openfast_aero_filename=IEA-22-280-RWT-Semi_AeroDyn15.dat
--openfast_elasto_filename=IEA-22-280-RWT-Semi_ElastoDyn_tower.dat

# Output directory for plots and exports. Comment out to use general.folder_output from analysis YAML.
--output_dir=outputs/04_tower_fatigue_optimization_cli
