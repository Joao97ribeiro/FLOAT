# Run: python examples/05_tower_fatigue_optimized_comparison/task.py --flagfile=examples/05_tower_fatigue_optimized_comparison/config.cfg
#
# Compares the final tower designs (CSVs) of FLOAT runs against a reference
# case. Adjust --ref_idx if the default (last entry) is not the baseline you
# want.
#
# LIST FLAGS (comma-separated values, e.g. --csv_paths=a.csv,b.csv):
#   --csv_paths   one entry per run
#   --labels      one label per run, in the same order as the CSV paths

# Output directory for the comparison plots + JSON summaries.
--output_dir=outputs/05_tower_fatigue_optimized_comparison

# Explicit list of CSVs (comma-separated, no spaces) and matching labels.
# The case at --ref_idx is treated as the reference (defaults to first entry).
--csv_paths=<path/to/case1_tower.csv>,<path/to/case2_tower.csv>,<path/to/case3_tower.csv>
--labels=<case1>,<case2>,<case3>
--ref_idx=0

# Bounds for the comparison plots come from the shared 22mw_fatigue_example inputs.
--files_dir=examples/input_files/22mw_fatigue_example
--analysis_filename=analysis_options_optimization

# Produce JSON summary + log to console.
--save_summary=True
--log_summary=True
